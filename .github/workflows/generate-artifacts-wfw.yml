name: Generate artifacts

on:
  workflow_dispatch:
    inputs:
      nuget:
        required: true
        default: true
        type: boolean
      testserver_linux_x64:
        required: true
        default: false
        type: boolean
      enableDesktopUITesting:
        required: true
        default: false
        type: boolean
      linux_x64_portable:
        required: true
        default: true
        type: boolean
      linux_x64_installers:
        required: true
        default: true
        type: boolean
      macos_x64:
        required: true
        default: true
        type: boolean
      win_x64_installer:
        required: true
        default: true
        type: boolean
      win_x64_portable:
        required: true
        default: true
        type: boolean
      win_x86_installer:
        required: true
        default: true
        type: boolean
      win_x86_portable:
        required: true
        default: true
        type: boolean        
      linux_arm64_portable:
        required: true
        default: true
        type: boolean
      linux_arm64_installers:
        required: true
        default: true
        type: boolean
      macos_arm64:
        required: true
        default: true
        type: boolean
      win_arm64_installer:
        required: true
        default: true
        type: boolean
      win_arm64_portable:
        required: true
        default: true
        type: boolean

jobs:
  nuget_linux_osx_x64:
    if: ${{ inputs.nuget || inputs.linux_x64_portable || inputs.linux_x64_installers || inputs.macos_x64 }}
    uses: ./.github/workflows/cicd-wfw.yml
    secrets: inherit
    with:
      os: ubuntu-26.04
      runCD: true
      enableUITesting: ${{ inputs.enableDesktopUITesting }}
      producePororocaTestNuget: ${{ inputs.nuget }}
      produceTestServerLinuxX64: ${{ inputs.testServer_linux_x64 }}
      produceDesktopLinuxPortableX64: ${{ inputs.linux_x64_portable }}
      produceDesktopLinuxInstallersX64: ${{ inputs.linux_x64_installers }}
      produceDesktopMacOSX64: ${{ inputs.macos_x64 }}
  
  nuget_linux_osx_arm64:
    if: ${{ inputs.nuget || inputs.linux_arm64_portable || inputs.linux_arm64_installers || inputs.macos_arm64 }}
    uses: ./.github/workflows/cicd-wfw.yml
    secrets: inherit
    with:
      os: ubuntu-26.04-arm
      runCD: true
      enableUITesting: ${{ inputs.enableDesktopUITesting }}   
      produceDesktopLinuxPortableArm64: ${{ inputs.linux_arm64_portable }}
      produceDesktopLinuxInstallersArm64: ${{ inputs.linux_arm64_installers }}
      produceDesktopMacOSArm64: ${{ inputs.macos_arm64 }}

  win_installer_portable_x64:
    if: ${{ inputs.win_x64_installer || inputs.win_x86_installer || inputs.win_x64_portable || inputs.win_x86_portable }}
    uses: ./.github/workflows/cicd-wfw.yml
    secrets: inherit
    with:
      os: windows-2025
      runCD: true
      enableUITesting: ${{ inputs.enableDesktopUITesting }}
      produceDesktopWinX64Installer: ${{ inputs.win_x64_installer }}
      produceDesktopWinX86Installer: ${{ inputs.win_x86_installer }}
      produceDesktopWinX64Portable: ${{ inputs.win_x64_portable }}
      produceDesktopWinX86Portable: ${{ inputs.win_x86_portable }}

  win_installer_portable_arm64:
    if: ${{ inputs.win_arm64_installer || inputs.win_arm86_installer }}
    uses: ./.github/workflows/cicd-wfw.yml
    secrets: inherit
    with:
      os: windows-11-arm
      runCD: true
      enableUITesting: ${{ inputs.enableDesktopUITesting }}   
      produceDesktopWinArm64Installer: ${{ inputs.win_arm64_installer }}
      produceDesktopWinArm64Portable: ${{ inputs.win_arm64_portable }}
